name: 'build-setup'
description: 'Generic setup for all builds'
inputs:
  toolchain:
    description: "Rust toolchain to use"
    required: false
    default: "stable"
runs:
  using: "composite"
  steps:
    - uses: r7kamura/rust-problem-matchers@v1
    - name: "Set up rust"
      shell: bash
      run: |
        rustup set profile minimal
        rustup component remove --toolchain=${{ inputs.toolchain }} rust-docs || echo "already removed"
        rustup update --no-self-update ${{ inputs.toolchain }}
        rustup default ${{ inputs.toolchain }}
        # Log versions
        rustup -V
        rustc -Vv
        cargo -V
    - name: Install latest Cranko (Ubuntu/macOS)
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        d="$(mktemp -d /tmp/cranko.XXXXXX)"
        cd "$d"
        curl --proto '=https' --tlsv1.2 -sSf https://pkgw.github.io/cranko/fetch-latest.sh | sh
        echo "PATH=$d:$PATH" >> "$GITHUB_ENV"
    - name: Install latest Cranko (Windows ARM64)
      if: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' }}
      shell: pwsh
      run: |
        $version = "0.17.3"
        $d = Join-Path $Env:Temp cranko-$(New-Guid)
        $archive = Join-Path $d cranko.zip
        $url = "https://github.com/pkgw/cranko/releases/download/cranko@$version/cranko-$version-x86_64-pc-windows-msvc.zip"
        [void][System.IO.Directory]::CreateDirectory($d)
        Invoke-WebRequest -Uri $url -OutFile $archive
        Expand-Archive -LiteralPath $archive -DestinationPath $d
        & (Join-Path $d cranko.exe) --version
        if ($LASTEXITCODE -ne 0) {
          throw "Cranko failed to run"
        }
        Add-Content -Value "PATH=${d};$Env:PATH" -Path $Env:GITHUB_ENV -Encoding utf8
    - name: Install latest Cranko (Windows x64)
      if: ${{ runner.os == 'Windows' && runner.arch != 'ARM64' }}
      shell: pwsh
      run: |
        $d = Join-Path $Env:Temp cranko-$(New-Guid)
        [void][System.IO.Directory]::CreateDirectory($d)
        cd $d
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://pkgw.github.io/cranko/fetch-latest.ps1'))
        Add-Content -Value "PATH=${d};$Env:PATH" -Path $Env:GITHUB_ENV -Encoding utf8
    - name: Add debug tools to PATH (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        Add-Content -Value "PATH=C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\;$Env:PATH" -Path $Env:GITHUB_ENV -Encoding utf8
    - name: Install release artifact
      uses: actions/download-artifact@v4
      with:
        name: release-bundle
        path: ${{ github.workspace }}/release-bundle
    - name: Restore release commit
      shell: bash
      run: |
        git switch -c release
        git pull --ff-only $GITHUB_WORKSPACE/release-bundle/release.bundle
